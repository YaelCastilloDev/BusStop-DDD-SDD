name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check code formatting
        run: dotnet format style --verify-no-changes --verbosity diagnostic

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore source projects
        run: dotnet restore src/BusStop.Web/BusStop.Web.csproj

      - name: Restore test projects
        run: |
          dotnet restore tests/BusStop.UnitTests/BusStop.UnitTests.csproj
          dotnet restore tests/BusStop.IntegrationTests/BusStop.IntegrationTests.csproj
          dotnet restore tests/BusStop.FunctionalTests/BusStop.FunctionalTests.csproj

      - name: Build source projects
        run: dotnet build src/BusStop.Web/BusStop.Web.csproj -c Release --no-restore

      - name: Build test projects
        run: |
          dotnet build tests/BusStop.UnitTests/BusStop.UnitTests.csproj -c Release --no-restore
          dotnet build tests/BusStop.IntegrationTests/BusStop.IntegrationTests.csproj -c Release --no-restore
          dotnet build tests/BusStop.FunctionalTests/BusStop.FunctionalTests.csproj -c Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test tests/BusStop.UnitTests/BusStop.UnitTests.csproj
          -c Release --no-build
          --verbosity normal
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Run integration tests
        run: >
          dotnet test tests/BusStop.IntegrationTests/BusStop.IntegrationTests.csproj
          -c Release --no-build
          --verbosity normal
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Run functional tests
        run: >
          dotnet test tests/BusStop.FunctionalTests/BusStop.FunctionalTests.csproj
          -c Release --no-build
          --verbosity normal
          --logger "trx;LogFileName=functional-tests.trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7
